name: Music validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - name: Start isolated regression dependencies
        shell: bash
        run: |
          set -euo pipefail
          key="$(openssl rand -base64 64 | tr -d '\n')"
          echo "::add-mask::$key"
          printf 'AZURITE_ACCOUNTS=musicregression:%s\n' "$key" > "$RUNNER_TEMP/music-test.env"
          docker run -d --name music-test-mongo -p 127.0.0.1:27017:27017 mongo:8.0 --replSet tests --bind_ip_all
          docker run -d --name music-test-azurite --env-file "$RUNNER_TEMP/music-test.env" -p 127.0.0.1:10000:10000 mcr.microsoft.com/azure-storage/azurite:3.35.0 azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck --silent
          for i in {1..30}; do
            docker exec music-test-mongo mongosh --quiet --eval 'try { rs.status(); } catch(e) { rs.initiate({_id:"tests",members:[{_id:0,host:"127.0.0.1:27017"}]}); }' >/dev/null 2>&1 && break
            sleep 2
          done
          for i in {1..30}; do
            docker exec music-test-mongo mongosh --quiet --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)' >/dev/null 2>&1 && break
            sleep 2
          done
          printf 'MUSIC_TEST_MONGO=mongodb://127.0.0.1:27017/?directConnection=true\n' >> "$GITHUB_ENV"
          printf 'MUSIC_TEST_STORAGE=DefaultEndpointsProtocol=http;AccountName=musicregression;AccountKey=%s;BlobEndpoint=http://127.0.0.1:10000/musicregression;\n' "$key" >> "$GITHUB_ENV"
      - run: dotnet restore Music.sln --locked-mode
      - run: dotnet build Music.sln --configuration Release --no-restore
      - run: dotnet test Music.sln --configuration Release --no-build --logger trx
      - name: Enforce current dependency advisories
        shell: bash
        run: |
          dotnet list Music.sln package --vulnerable --include-transitive --no-restore --format json > advisories.json
          python3 scripts/check-advisories.py --self-test
          python3 scripts/check-advisories.py advisories.json Music.csproj Music.Tests.csproj
      - run: docker build -t spotibuds-music-check .
      - name: Remove only regression containers
        if: always()
        run: docker rm -fv music-test-mongo music-test-azurite || true
