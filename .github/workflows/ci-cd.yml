name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  REGISTRY: spotibuds.azurecr.io
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Restore dependencies
      run: dotnet restore Music.csproj

    - name: Build Music API
      run: dotnet build Music.csproj --configuration Release --no-restore

    - name: Run Music API tests
      run: dotnet test tests/Music.Tests/Music.Tests.csproj --configuration Release

    - name: Check vulnerable packages
      run: dotnet list Music.csproj package --vulnerable --include-transitive

    - name: Build Music API image
      uses: docker/build-push-action@v5
      with:
        context: ./
        file: ./Dockerfile
        load: true
        tags: spotibuds-music-api:${{ env.IMAGE_TAG }}

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Azure Container Registry
      uses: azure/docker-login@v2
      with:
        login-server: ${{ env.REGISTRY }}
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    - name: Build and push Music API
      uses: docker/build-push-action@v5
      with:
        context: ./
        file: ./Dockerfile
        push: true
        tags: ${{ env.REGISTRY }}/music-api:${{ env.IMAGE_TAG }}

    - name: Deploy Music API to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: music-spotibuds
        publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_MUSIC }}
        images: ${{ env.REGISTRY }}/music-api:${{ env.IMAGE_TAG }}
